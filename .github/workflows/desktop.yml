name: Linux desktop packages

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav webkit2gtk-driver xvfb
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: npm run build
      - run: npm run desktop:check
      - run: npm run desktop:test
      - name: Build installers
        run: npm run desktop:build -- --ci
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Smoke test Linux AppImage
        run: node scripts/native-smoke.mjs --appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - run: npm run desktop:checksums
      - uses: actions/upload-artifact@v4
        with:
          name: atiga-amp-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: atiga-amp-*
          path: release-input
          merge-multiple: false
      - run: node scripts/prepare-release-assets.mjs release-input release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "Atiga Amp ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          fi
